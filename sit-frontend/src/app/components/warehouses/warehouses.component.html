<div class="container-fluid mt-4" *ngIf="isSuperAdmin">

  <!-- TOP BAR -->
  <div class="top-bar">
    <input
      type="text"
      placeholder="Search warehouses..."
      class="search-input"
      [(ngModel)]="searchTerm"
      (input)="applyFilter()"
    />

    <button class="btn-add" (click)="viewOnMap()">
      <i class="bi bi-map"></i> View Map
    </button>

    <button class="btn-add" (click)="openAddWarehouse()">
      <i class="bi bi-plus-circle"></i> Add Warehouse
    </button>
  </div>

  <!-- WAREHOUSES TABLE -->
  <div class="table-wrapper fade-in">
    <table class="custom-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Address</th>
          <th>Coordinates</th>
          <th>Assigned Admin</th>
          <th style="width: 120px;">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let w of filteredWarehouses">
          <td><strong>{{ w.name }}</strong></td>
          <td>{{ w.address }}</td>
          <td>{{ w.latitude.toFixed(6) }}, {{ w.longitude.toFixed(6) }}</td>
          <td>{{ getAdminName(w.adminId) }}</td>

          <td class="action-col">
            <!-- EDIT -->
            <span class="action-icon edit" (click)="openEditWarehouse(w)">
              <i class="bi bi-pencil-square"></i>
              <span class="tooltip">Edit</span>
            </span>

            <!-- DELETE -->
            <span class="action-icon delete" (click)="deleteWarehouse(w)">
              <i class="bi bi-trash-fill"></i>
              <span class="tooltip">Delete</span>
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- BACKDROP -->
  <div class="modal-backdrop-custom" *ngIf="showModal"></div>

  <!-- MODAL -->
  <div class="custom-modal fade-in" *ngIf="showModal" style="width: 500px;">
    <div class="modal-content-custom">

      <!-- TITLE -->
      <h4 class="modal-title">
        {{ mode === 'add' ? 'Add Warehouse' : 'Edit Warehouse' }}
      </h4>

      <!-- NAME -->
      <label>Name</label>
      <input
        type="text"
        class="form-control-custom"
        [(ngModel)]="name"
        placeholder="Enter warehouse name"
      />

      <!-- ADDRESS -->
      <label>Address</label>
      <input
        type="text"
        class="form-control-custom"
        [(ngModel)]="address"
        placeholder="Enter address"
      />

      <!-- COORDINATES -->
      <label>Coordinates</label>
      <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <input
          type="number"
          class="form-control-custom"
          [(ngModel)]="latitude"
          placeholder="Latitude"
          step="any"
          style="flex: 1;"
        />
        <input
          type="number"
          class="form-control-custom"
          [(ngModel)]="longitude"
          placeholder="Longitude"
          step="any"
          style="flex: 1;"
        />
      </div>
      <button type="button" class="btn-map" (click)="openMapForCoordinates()">
        <i class="bi bi-geo-alt"></i> Select on Map
      </button>

      <!-- ASSIGNED ADMIN -->
      <label>Assigned Admin</label>
      <select class="form-control-custom" [(ngModel)]="adminId">
        <option value="">— None —</option>
        <option *ngFor="let admin of allAdmins" [value]="admin.uid">
          {{ admin.name || admin.email }}
        </option>
      </select>

      <!-- ERROR -->
      <div *ngIf="errorMessage" class="error-box">
        {{ errorMessage }}
      </div>

      <!-- BUTTONS -->
      <div class="modal-buttons">
        <button class="btn-cancel" (click)="closeModal()">Cancel</button>
        <button class="btn-save" (click)="submitForm()">Save</button>
      </div>

    </div>
  </div>

</div>
