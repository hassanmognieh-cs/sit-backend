<div class="modal fade show" style="display:block;" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">
          {{ mode === 'add' ? 'Add Category' : 'Edit Category' }}
        </h5>
        <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <form [formGroup]="categoryForm" (ngSubmit)="submitForm()">

          <!-- Name -->
          <div class="mb-3">
            <label class="form-label">Name <span class="text-danger">*</span></label>
            <input
              type="text"
              class="form-control"
              formControlName="name"
              [class.is-invalid]="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched"
            >
            <div class="invalid-feedback" *ngIf="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched">
              Name is required
            </div>
          </div>

          <!-- Description -->
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" formControlName="description" rows="3"></textarea>
          </div>

        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="submitForm()">
          {{ mode === 'add' ? 'Add Category' : 'Update Category' }}
        </button>
      </div>

    </div>
  </div>
</div>
