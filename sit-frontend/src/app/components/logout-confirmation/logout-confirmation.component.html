<div class="logout-confirmation-container">
  <div class="logout-confirmation-card">
    <div class="icon-wrapper">
      <i class="bi bi-box-arrow-right"></i>
    </div>
    <h2>Confirm Logout</h2>
    <p>Are you sure you want to logout? You will need to sign in again to access your account.</p>
    <div class="button-group">
      <button class="btn-cancel" (click)="cancelLogout()">
        <i class="bi bi-x-circle"></i>
        Cancel
      </button>
      <button class="btn-confirm" (click)="confirmLogout()">
        <i class="bi bi-check-circle"></i>
        Logout
      </button>
    </div>
  </div>
</div>
