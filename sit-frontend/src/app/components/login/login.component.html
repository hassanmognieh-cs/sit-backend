<div class="login-page">
  <div class="login-card">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">
        <i class="bi bi-boxes"></i>
      </div>
      <h1 class="brand-name">Smart Inventory</h1>
      <p class="brand-sub">Sign in to your workspace</p>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <!-- Email -->
      <div class="field-group">
        <label class="field-label">
          <i class="bi bi-envelope"></i>
          Email address
        </label>
        <input
          class="field-input"
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          [class.invalid]="form.get('email')?.invalid && form.get('email')?.touched">
        <p class="field-error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Please enter a valid email address
        </p>
      </div>

      <!-- Password -->
      <div class="field-group">
        <label class="field-label">
          <i class="bi bi-lock"></i>
          Password
        </label>
        <div class="field-input-wrap">
          <input
            class="field-input"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
            [class.invalid]="form.get('password')?.invalid && form.get('password')?.touched">
          <button
            type="button"
            class="eye-btn"
            (click)="showPassword = !showPassword"
            tabindex="-1">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
        <p class="field-error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          Password is required
        </p>
      </div>

      <!-- Submit -->
      <button
        class="signin-btn"
        type="submit"
        [disabled]="loading || form.invalid">
        <ng-container *ngIf="!loading">
          <i class="bi bi-box-arrow-in-right"></i>
          Sign In
        </ng-container>
        <ng-container *ngIf="loading">
          <i class="bi bi-arrow-repeat spin"></i>
          Signing in...
        </ng-container>
      </button>

    </form>

    <!-- Error -->
    <div class="error-msg" *ngIf="message && !loading">
      <i class="bi bi-exclamation-circle"></i>
      {{ message }}
    </div>

  </div>
</div>
